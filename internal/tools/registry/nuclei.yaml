id: nuclei
category: web
display_name: Nuclei
image: cosmics/kali-tools:latest
binary: nuclei
version_cmd: ["nuclei", "-version"]
arg_schema:
  type: object
  additionalProperties: false
  required: ["target"]
  properties:
    target:
      type: string
      minLength: 1
      maxLength: 255
    severity:
      type: string
      enum: ["info", "low", "medium", "high", "critical"]
    tags:
      type: string
      maxLength: 256
      pattern: '^[A-Za-z0-9,_-]+$'
    rate_limit:
      type: integer
      minimum: 1
      maximum: 1000
command_template: >-
  nuclei -jsonl -silent -no-color -duc
  {{if .severity}}-severity {{q .severity}}{{end}}
  {{if .tags}}-tags {{q .tags}}{{end}}
  {{if .rate_limit}}-rate-limit {{q .rate_limit}}{{end}}
  -u {{q .target}}
capabilities: [VULN_SCAN, CVE_DETECT]
network_mode: bridge
default_timeout_s: 900
max_output_bytes: 1048576
danger_level: intrusive
requires_approval: false
parser: jsonl
fidelity_caveats:
  - "Template-based detection only: it confirms the templates you have, not the absence of other issues."
  - "Some templates send exploit-like payloads; treat a match as a lead requiring manual validation."
notes: Template-driven vulnerability scanning; a match is a lead, not a confirmed finding.
enabled: true
